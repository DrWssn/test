name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/medical-notes
        run: pnpm exec expo prebuild --platform android --no-install

      # Google sign-in only works if an Android OAuth client in Google Cloud has this exact SHA-1.
      - name: Show signing SHA-1 for Google Cloud
        working-directory: artifacts/medical-notes/android/app
        run: |
          SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:' | awk '{print $2}')
          echo "Signing SHA-1: $SHA1"
          {
            echo "### Google Cloud Android OAuth client"
            echo "- Package name: \`com.drwssn.medicalnotes\`"
            echo "- SHA-1: \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK (JS bundled in, debug-signed)
        working-directory: artifacts/medical-notes/android
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        # arm64 only: covers virtually all current phones and cuts native build time by ~4x.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: medical-notes-apk
          path: artifacts/medical-notes/android/app/build/outputs/apk/release/*.apk
