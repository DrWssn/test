name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The release keystore was exported by Windows .NET, which names its only key "1".
      ANDROID_KEY_ALIAS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/medical-notes
        run: pnpm exec expo prebuild --platform android --no-install

      # Release key lives in repo secrets; without them the APK falls back to the public debug key.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; signing with the debug key."
          fi

      # Google sign-in only works if an Android OAuth client in Google Cloud has this exact SHA-1.
      - name: Show signing SHA-1 for Google Cloud
        working-directory: artifacts/medical-notes/android/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            keytool -list -storetype pkcs12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD"
            SHA1=$(keytool -list -v -storetype pkcs12 -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep 'SHA1:' | awk '{print $2}')
            KEY=release
          else
            SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:' | awk '{print $2}')
            KEY=debug
          fi
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read the $KEY key's SHA-1 (wrong alias or password?)"
            exit 1
          fi
          echo "Signing SHA-1 ($KEY key): $SHA1"
          {
            echo "### Google Cloud Android OAuth client"
            echo "- Package name: \`com.drwssn.medicalnotes\`"
            echo "- SHA-1 ($KEY key): \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK (JS bundled in)
        working-directory: artifacts/medical-notes/android
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # arm64 only: covers virtually all current phones and cuts native build time by ~4x.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: medical-notes-apk
          path: artifacts/medical-notes/android/app/build/outputs/apk/release/*.apk
